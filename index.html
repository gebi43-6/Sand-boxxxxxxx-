<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모래 상자 샌드박스</title>
<style>
:root{--bg:#f1ece2;--panel:#e4ddcf;--ink:#2a2620;--mute:#7a7164;--well:#fbf8f1;--acc:#2f6f8f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--panel:#24262c;--ink:#ece8df;--mute:#8d8a82;--well:#0e0f12;--acc:#6fb4d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181c;--panel:#24262c;--ink:#ece8df;--mute:#8d8a82;--well:#0e0f12;--acc:#6fb4d4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:920px;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:.8rem;font-weight:500;color:var(--mute)}
#wrap{background:var(--well);border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--panel);line-height:0}
canvas{width:100%;aspect-ratio:5/3;image-rendering:pixelated;touch-action:none;cursor:crosshair;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{border-color:var(--acc)}
.sw{width:16px;height:16px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem;flex:1;min-width:200px}
input[type=range]{flex:1;accent-color:var(--acc)}
button.danger{background:var(--acc);color:#fff;margin-left:auto}
.hint{color:var(--mute);font-size:.85rem;margin:0}
</style>
</head>
<body>
<main>
<h1>모래 상자 <small id="cnt"></small></h1>
<div id="wrap"><canvas id="c" width="200" height="120"></canvas></div>
<div class="pal" id="pal"></div>
<div class="ctl">
<label>붓 크기 <input id="size" type="range" min="1" max="10" value="3"><span id="sv">3</span></label>
<button id="pause">일시정지</button>
<button id="clear" class="danger">모두 지우기</button>
<button id="water">모든 물 지우기</button>
</div>
<p class="hint">나무는 천천히 오래 타고 기름은 순식간에 번져요. 물이 불을 끄면 증기가 올라가 위에서 비로 내려옵니다. 용암은 물을 만나면 돌로 식고, 식물은 물을 빨아들여 위로 자랍니다.</p>
</main>
<script>
const W=200,H=120,N=W*H;
const g=new Uint8Array(N),v=new Uint8Array(N),s=new Uint8Array(N);
// 0 빈칸 1 모래 2 물 3 돌 4 나무 5 불 6 기름 7 연기 8 식물
const EL=[
 {n:"지우개",c:[0,0,0]},{n:"모래",c:[219,185,104]},{n:"물",c:[63,129,214]},{n:"돌",c:[128,128,134]},
 {n:"나무",c:[121,79,44]},{n:"불",c:[255,120,30]},{n:"기름",c:[222,190,30]},{n:"연기",c:[150,150,155]},
 {n:"식물",c:[64,163,74]},{n:"증기",c:[225,232,240]},{n:"용암",c:[255,90,20]}
];
const D=[0,3,2,9,9,0,1,0,9,0,5], F=[0,0,1,0,0,0,1,0,0,0,1];
const IGN={4:.04,6:.3,8:.12};
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),img=ctx.createImageData(W,H),px=img.data;
let sel=1,brush=3,paused=false,fr=1,down=false,lx=0,ly=0;
const r=Math.random;
function sw(a,b){let t=g[a];g[a]=g[b];g[b]=t;t=v[a];v[a]=v[b];v[b]=t;s[a]=s[b]=fr}
const DX=[1,-1,0,0],DY=[0,0,1,-1];
function nb(x,y){const k=(r()*4)|0,nx=x+DX[k],ny=y+DY[k];return nx<0||ny<0||nx>=W||ny>=H?-1:ny*W+nx}
function mv(i,j,e){const t=g[j];if(t===0||(F[t]&&D[e]>D[t]&&r()>.35)){sw(i,j);return true}return false}
function fall(i,x,y,e,dx){
 if(mv(i,i+W,e))return true;
 if(x+dx>=0&&x+dx<W&&mv(i,i+W+dx,e))return true;
 if(x-dx>=0&&x-dx<W&&mv(i,i+W-dx,e))return true;
 return false}
function flow(i,x,y,k){
 const dx=r()<.5?-1:1;
 for(const d0 of [dx,-dx]){let best=-1;
  for(let d=1;d<=k;d++){const nx=x+d0*d;if(nx<0||nx>=W||g[y*W+nx]!==0)break;best=y*W+nx}
  if(best>=0){sw(i,best);return true}}
 return false}
function ign(n){const t=g[n];g[n]=5;v[n]=t===4?126+(r()*100|0):t===6?66+(r()*30|0):46+(r()*20|0);s[n]=fr}
function up(i,x,y,sp){
 if(y<=0)return false;const off=sp?((r()*3)|0)-1:0,nx=x+off;
 if(nx<0||nx>=W)return false;const j=i-W+off;
 if(g[j]===0){sw(i,j);return true}return false}
function shade(i){v[i]=(r()*32)|0}
function step(){
 fr=fr===1?2:1;
 for(let y=H-1;y>=0;y--){
  const ltr=r()<.5;
  for(let k=0;k<W;k++){
   const x=ltr?k:W-1-k,i=y*W+x,e=g[i];
   if(!e||s[i]===fr)continue;
   const dx=r()<.5?-1:1;
   if(e===1){
    if(y<H-1)fall(i,x,y,e,dx);
   }else if(e===2||e===6){
    if(y<H-1&&fall(i,x,y,e,dx))continue;
    flow(i,x,y,e===2?4:3);
   }else if(e===10){
    const n=nb(x,y);
    if(n>=0){const t=g[n];
     if(t===2){g[i]=3;shade(i);g[n]=9;s[n]=fr;s[i]=fr;continue}
     if(IGN[t]&&r()<.5)ign(n)}
    if(r()<.0002){g[i]=3;continue}
    if(r()<.3){if(y<H-1&&fall(i,x,y,e,dx))continue;flow(i,x,y,1)}
   }else if(e===5){
    const L=v[i],n=nb(x,y);
    if(L>=25){
     if(r()<.3){v[i]=L-1;if(L-1<25){const q=r();g[i]=q<.4?7:0;shade(i);continue}}
     const q=r();
     if(y>0&&g[i-W]===0){if(q<.12){g[i-W]=5;v[i-W]=8+(r()*12|0);s[i-W]=fr}else if(q<.15){g[i-W]=7;shade(i-W);s[i-W]=fr}}
     if(n>=0){const t=g[n];
      if(t===2){g[i]=7;shade(i);if(r()<.4){g[n]=9;s[n]=fr}continue}
      if(IGN[t]&&r()<IGN[t])ign(n)}
    }else{
     if(L<=1){g[i]=r()<.3?7:0;shade(i);continue}
     v[i]=L-1;
     if(n>=0){const t=g[n];
      if(t===2){g[i]=0;if(r()<.3){g[n]=9;s[n]=fr}continue}
      if(IGN[t]&&r()<IGN[t]*.6)ign(n)}
     up(i,x,y,r()<.5);
    }
   }else if(e===7){
    if(r()<.012){g[i]=0;continue}
    if(up(i,x,y,true))continue;
    if(x+dx>=0&&x+dx<W&&g[i+dx]===0)sw(i,i+dx);
   }else if(e===9){
    if(r()<.0015||(y===0&&r()<.1)){g[i]=2;shade(i);continue}
    if(up(i,x,y,true))continue;
    if(r()<.04){g[i]=2;shade(i);continue}
    if(x+dx>=0&&x+dx<W&&g[i+dx]===0)sw(i,i+dx);
   }else if(e===8){
    const n=nb(x,y);
    if(n>=0&&g[n]===2&&r()<.08){
     g[n]=0;
     for(let a=0;a<3;a++){const gx=x+((r()*3)|0)-1,gy=y-1;
      if(gy>=0&&gx>=0&&gx<W&&g[gy*W+gx]===0){const j=gy*W+gx;g[j]=8;shade(j);s[j]=fr;break}}
    }
   }
  }
 }
}
function render(){
 let c=0;
 for(let i=0;i<N;i++){
  const e=g[i],p=i*4;
  if(!e){px[p+3]=0;continue}
  c++;
  const col=EL[e].c;let m=.88+v[i]/32*.24,R=col[0],G=col[1],B=col[2];
  if(e===5){const L=v[i];m=1;R=255;if(L>=25){G=60+r()*70;B=15}else{G=Math.min(255,110+L*7+r()*40);B=30}}
  else if(e===10){m=1;G=60+r()*70}
  px[p]=Math.min(255,R*m);px[p+1]=Math.min(255,G*m);px[p+2]=Math.min(255,B*m);
  px[p+3]=e===7?140:e===9?110:255;
 }
 ctx.putImageData(img,0,0);
 document.getElementById("cnt").textContent=c+"개 입자";
}
function paint(cx,cy){
 const R=brush;
 for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
  if(dx*dx+dy*dy>R*R)continue;
  const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=W||y>=H)continue;
  const i=y*W+x;
  if(sel===0){g[i]=0;continue}
  if(g[i]!==0)continue;
  const soft=[1,2,5,6,7,9,10].includes(sel);
  if(soft&&r()<.45)continue;
  g[i]=sel;v[i]=sel===5?10+((r()*12)|0):((r()*32)|0);s[i]=0;
 }
}
function pos(ev){const b=cv.getBoundingClientRect();return[Math.floor((ev.clientX-b.left)/b.width*W),Math.floor((ev.clientY-b.top)/b.height*H)]}
function line(x0,y0,x1,y1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let k=0;k<=n;k++)paint(Math.round(x0+(x1-x0)*k/n),Math.round(y0+(y1-y0)*k/n))}
cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);paint(lx,ly)});
cv.addEventListener("pointermove",e=>{if(!down)return;const[x,y]=pos(e);line(lx,ly,x,y);lx=x;ly=y});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>down=false));
const pal=document.getElementById("pal");
EL.forEach((el,i)=>{
 const b=document.createElement("button");
 b.innerHTML='<span class="sw" style="background:'+(i?'rgb('+el.c+')':'repeating-linear-gradient(45deg,#bbb 0 3px,#eee 3px 6px)')+'"></span>'+el.n;
 if(i===sel)b.classList.add("on");
 b.onclick=()=>{sel=i;[...pal.children].forEach(x=>x.classList.remove("on"));b.classList.add("on")};
 pal.appendChild(b);
});
const sz=document.getElementById("size");
sz.oninput=()=>{brush=+sz.value;document.getElementById("sv").textContent=brush};
const pb=document.getElementById("pause");
pb.onclick=()=>{paused=!paused;pb.textContent=paused?"재생":"일시정지"};
document.getElementById("clear").onclick=()=>{g.fill(0);v.fill(0);s.fill(0)};
document.getElementById("water").onclick=()=>{for(let i=0;i<N;i++)if(g[i]===2)g[i]=0};
(function loop(){
 if(down)paint(lx,ly);
 if(!paused)step();
 render();
 requestAnimationFrame(loop);
})();
</script>
</body>
</html>
